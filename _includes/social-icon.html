{% if include.platform == "bluesky" %}
  <span class="social-icon social-icon-bluesky" aria-hidden="true">🦋</span>
{% elsif include.platform == "twitter" %}
  <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231 5.451-6.231Zm-1.161 17.52h1.833L7.084 4.126H5.117L17.083 19.77Z"></path>
  </svg>
{% else %}
  <svg class="social-icon" aria-hidden="true">
    <use href="{{ '/assets/social-icons.svg#' | append: include.platform | relative_url }}"
         xlink:href="{{ '/assets/social-icons.svg#' | append: include.platform | relative_url }}"></use>
  </svg>
{% endif %}
