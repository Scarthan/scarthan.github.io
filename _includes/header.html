<header class="site-header" role="banner">

  <div class="wrapper">
    <a class="site-title" rel="author" href="{{ "/" | absolute_url }}">{{ site.title | escape }}</a>

    <div class="search-container">
      <label class="sr-only" for="search-input">Search posts</label>
      <input
        type="search"
        id="search-input"
        placeholder="Search posts..."
        autocomplete="off"
        aria-controls="results-container"
        aria-describedby="search-status">
      <p id="search-status" class="sr-only" aria-live="polite"></p>
      <ul id="results-container" aria-label="Search results" hidden></ul>
    </div>

    <nav class="site-nav" aria-label="Primary navigation">
      <button class="nav-toggle" id="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-links">
        <span class="menu-icon" aria-hidden="true">
          <span></span><span></span><span></span>
        </span>
        <span class="sr-only">Toggle navigation</span>
      </button>

      <div class="trigger" id="nav-links">
        <a class="page-link" href="{{ "/tags/" | relative_url }}"{% if page.url == "/tags/" %} aria-current="page"{% endif %}>Tags</a>
        <a class="page-link" href="{{ "/terminal/" | relative_url }}"{% if page.url == "/terminal/" %} aria-current="page"{% endif %}>Terminal</a>
        <button class="page-link theme-toggle" id="theme-toggle" type="button">
          <span class="theme-icon" aria-hidden="true">☾</span>
          <span class="sr-only theme-label">Use dark mode</span>
        </button>
        <a class="page-link icon-link" href="{{ "/feed.xml" | relative_url }}" aria-label="Subscribe via RSS">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="5" cy="19" r="2"></circle>
            <path d="M4 11a9 9 0 0 1 9 9"></path>
            <path d="M4 4a16 16 0 0 1 16 16"></path>
          </svg>
        </a>
      </div>
    </nav>
  </div>
</header>
