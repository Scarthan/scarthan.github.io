<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}{% if paginator.total_pages > 1 and paginator.page > 1 %} - Page {{ paginator.page }} of {{ paginator.total_pages }}{% endif %}</title>
  {% seo title=false %}

  <script>
    (function () {
      var savedTheme = localStorage.getItem('theme');
      document.documentElement.setAttribute('data-theme', savedTheme || 'light');
    }());
  </script>
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title | escape }}" href="{{ "/feed.xml" | relative_url }}">
  <link rel="icon" type="image/png" sizes="512x512" href="{{ "/assets/favicon.png" | relative_url }}?v=2">
  <link rel="shortcut icon" type="image/x-icon" href="{{ "/assets/favicon.ico" | relative_url }}?v=2">
  <link rel="apple-touch-icon" sizes="512x512" href="{{ "/assets/favicon.png" | relative_url }}?v=2">

  {% if jekyll.environment == 'production' %}
  <meta name="baidu-site-verification" content="EnE9taiVxH" />
  <meta name="msvalidate.01" content="41CB1590F95E0D73A1A2157A9D681C62" />
  {% if site.baidu_autopush %}
  {% include baidu_autopush.html %}
  {% endif %}
  {% endif %}
</head>
